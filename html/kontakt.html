	<script src="../js/scosic24.js"></script>
</head>

<body>
	<header>
		<nav>
			<button id="tipkaZaMobilniIzbornik" onclick="PromjeniIzbornik()"><img src=" ../resursi/slike/ikonaIzbornik.png"
					alt="ikona izbornik"></button>
			<h1>HiPo</h1>
			<ul>
				<li><a href="index.html">HIPO</a></li>
				<li><a href="index.html">Početna stranica</a></li>

				<li><a href="dokumentacija.html">Dokumentacija</a></li>
			</ul>
		</nav>
	</header>
	<main>
		<div class="jednostavanOkvir">
			<div id="okvirZaFormu">
				<h1>Kontaktirajte nas!</h1>
				<p>
					Obratite nam se s povjerenjem. Odgovoriti ćemo na sva Vaša pitanja, kritike i pohvale u najbržem
					mogućem roku! <br> <span class="masniTekst">* označava obavezna polja i ona ne smiju biti prazna!</span>
				</p>

				<form novalidate id="obrazacZaKontakt" action="https://spider.foi.hr/OWT/materijali/ispis_forme.php"
					method="POST">
					<label for=" unosIme">Ime <span class="informacijeUvjetaUnosa">*</span>: </label>
					<input type="text" id="unosIme" name="Ime" placeholder="..." required>
					<p class="porukaGreske" id="porukaGreskeIme"></p>
					<br>

					<label for="unosPrezime">Prezime:</label>
					<input type="text" id="unosPrezime" name="Prezime" placeholder="...">
					<p class="porukaGreske" id="porukaGreskePrezime"></p>
					<br>

					<label for="unosLozinka">Lozinka <span class="informacijeUvjetaUnosa">(* min. 10 znakova)</span>:</label>
					<input type="password" id="unosLozinka" name="Lozinka" placeholder="***" required>
					<p class="porukaGreske" id="porukaGreskeLozinka"></p>
					<br>

					<label for="unosWebStraniceOrganizacije">Web stranica organizacije:</label>
					<input type="url" id="unosWebStraniceOrganizacije" name="AdresaWebStranice" placeholder="hipo.hr">
					<br>

					<label for="unosEmail *">E-mail adresa <span class="informacijeUvjetaUnosa">(* ako želite
							obavijesti)</span>:</label>
					<input type="email" id="unosEmail" name="Email" placeholder="netko@mail.com"
						onchange="ProvjeriIspravnostEmaila()">
					<p class="porukaGreske" id="porukaGreskeEmail"></p>
					<br>

					<label for="unosTelefona">Broj telefona:</label>
					<input type="tel" id="unosTelefona" name="Telefon" placeholder="+385 0000 000">
					<br>

					<label for="unosDanasnjegDatuma">Današnji datum <span class="informacijeUvjetaUnosa">*</span>: </label>
					<input type="date" id="unosDanasnjegDatuma" name="DanasnjiDatum" value="2026-04-01"
						onchange="ProvjeriSmislenostDatuma()" required>
					<br>

					<label for="unosDatumaDogadaja">Datum događaja/incidenta <span class="informacijeUvjetaUnosa">*</span>:
					</label>
					<input type="date" id="unosDatumaDogadaja" name="DatumDogadaja" value="2026-04-01"
						onchange="ProvjeriSmislenostDatuma()" required>
					<p class="porukaGreske" id="porukaGreskeDatuma"></p>
					<br>

					<label for="unosZadovoljstvo">Zadovoljstvo:</label>
					<br>
					<input type="range" id="unosZadovoljstvo" name="Zadovoljstvo" min="1" max="10" value="5">
					<br>

					<label for="unosRazlog">Razlog poruke:</label>
					<select name="RazlogPoruke" id="unosRazlog">
						<option value="Pitanje">Pitanje</option>
						<option value="Recenzija">Recenzija</option>
						<option value="Reklamacija">Reklamacija</option>
					</select>
					<br>
					<br>

					<label for="unosNaslovPoruke">Naslov poruke <span class="informacijeUvjetaUnosa">(*ako postoji
							sadržaj)</span>: </label>
					<input type="text" id="unosNaslovPoruke" name="NaslovPoruke" placeholder="...">
					<p class="porukaGreske" id="porukaGreskeNaslovProuke"></p>
					<br>

					<label for="unosSadrzajPoruke">Sadržaj poruke:</label>
					<textarea name="SadrzajPoruke" id="unosSadrzajPoruke"></textarea>

					<label for="unosDatoteke">Prenesite datoteku <span class="informacijeUvjetaUnosa">(PDF ili
							JPG)</span>:</label>
					<input type="file" id="unosDatoteke" name="Datoteka">
					<p class="porukaGreske" id="porukaGreskeDatoteke"></p>
					<br>

					<input type="checkbox" id="odabirObavijesti" name="IzabranaObavijest0" onchange="ProvjeriIspravnostEmaila()">
					<label for="odabirObavijesti">Želim dobivati obavijesti na e-mail</label>
					<input type="submit" value="Pošalji" class="zelenaTipka" id="tipkaZaSlanje">
				</form>
			</div>
			<div></div>
		</div>
	</main>
	<footer>
		<a href=" http://validator.w3.org/check?uri=https://spider.foi.hr/OWT/2026/zadaca_01/scosic24/html/kontakt.html"
			target="_blank">
			<img src="https://spider.foi.hr/OWT/materijali/slike/HTML5.png" alt="Ikona HTML5 validatora">
		</a>
	</footer>

	<script src="../js/scosic24_obrazac.js"></script>
</body>

</html>
